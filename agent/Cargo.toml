[package]
name = "janus-agent"
version = "0.14.0"
edition = "2021"
rust-version = "1.96"

[lib]
name = "janus_interceptor"
crate-type = ["cdylib"]
path = "src/interceptor.rs"

[[bin]]
name = "janus-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
diffy = "0.4"
hex = "0.4"
hmac = "0.12"
subtle = "2.6"
hostname = "0.4"
prost = "0.13"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17"
object = { version = "0.32", default-features = false, features = ["read_core", "elf", "pe", "macho"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.33"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.12", features = ["transport", "tls"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
] }
fips204 = "0.4.6"
# Structural X.509/DER parsing for ML-DSA command-cert verification (WP-029 P3). The cert
# signature itself is verified with fips204 (ML-DSA), which no X.509 crate supports; this only
# parses the structure (raw TBS bytes, SPKI, issuer/subject, validity).
x509-parser = "0.16"
# Online OCSP revocation checking for discovered TLS endpoints (FEAT-OCSP / WP-016). The
# responder-signature verification x509-ocsp does NOT do is implemented on top with `ring`.
x509-cert = { version = "0.2", features = ["pem"] }
x509-ocsp = { version = "0.2", features = ["builder"] }
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
sha1 = { version = "0.10", features = ["oid"] }
# RFC 3339 timestamps for CycloneDX/SARIF exports (WP-021 standards compliance).
time = { version = "0.3", features = ["formatting"] }
# Pure-Rust x86/x64 static disassembler for binary-analysis evidence (LLM-007). Static byte
# decoding only — no execution, so no sandbox is required.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "nasm"] }
